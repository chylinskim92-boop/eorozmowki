<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiszki Esperanto - 1000 Zdań</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            text-align: center;
        }

        .select-container {
            margin-bottom: 20px;
        }

        select {
            padding: 8px 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 550px;
            height: 280px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
            border-radius: 12px;
            background-color: var(--card-bg);
            border: 2px solid var(--primary);
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #e8f5e9;
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 15px;
        }

        .content {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 20px;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .counter {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="select-container">
        <label for="set-select">Wybierz Zestaw: </label>
        <select id="set-select" onchange="changeSet()">

            <option value="1">Zestaw 1 (1-100)</option>
            <option value="2">Zestaw 2 (101-200)</option>
            <option value="3">Zestaw 3 (201-300)</option>
            <option value="4">Zestaw 4 (301-400)</option>
            <option value="5">Zestaw 5 (401-500)</option>
            <option value="6">Zestaw 6 (501-600)</option>
            <option value="7">Zestaw 7 (601-700)</option>
            <option value="8">Zestaw 8 (701-800)</option>
            <option value="9">Zestaw 9 (801-900)</option>
            <option value="10">Zestaw 10 (901-1000)</option>
        </select>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <div class="label" id="front-label">Język polski</div>
                <div class="content" id="front-text">Ładowanie...</div>
                <div class="hint">Kliknij, aby zobaczyć tłumaczenie</div>

            <div class="card-face card-back">

                <div class="content" id="back-text">Ładowanie...</div>
                <div class="hint">Kliknij, aby odwrócić</div>
            </div>
        </div>
    </div>

    <div class="counter" id="counter">Fiszka 1 z 1000</div>

    <div class="controls">
        <button onclick="prevCard()">Poprzednia</button>
        <button onclick="nextCard()">Następna</button>

        let activeCards = [...allCards];
        let currentIndex = 0;
        let isFlipped = false;

        function renderText() {
            if (activeCards.length === 0) return;
            document.getElementById('front-text').innerText = activeCards[currentIndex].pl;
            document.getElementById('back-text').innerText = activeCards[currentIndex].eo;
            document.getElementById('counter').innerText = `Zdanie ${activeCards[currentIndex].id} (Fiszka ${currentIndex + 1} z ${activeCards.length})`;
        }

        function flipCard() {
            const cardElement = document.getElementById('flashcard');
            cardElement.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function updateCard() {
            const cardElement = document.getElementById('flashcard');
            if (isFlipped) {
                cardElement.classList.remove('flipped');
                isFlipped = false;
                setTimeout(renderText, 250);
            } else {
                renderText();
            }
        }

        function nextCard() {
            if (activeCards.length === 0) return;
            currentIndex = (currentIndex + 1) % activeCards.length;
            updateCard();
        }

        function prevCard() {
            if (activeCards.length === 0) return;
            currentIndex = (currentIndex - 1 + activeCards.length) % activeCards.length;
            updateCard();
        }

            const val = document.getElementById('set-select').value;
            if (val === 'all') {
                activeCards = [...allCards];
            } else {
                const setNum = parseInt(val);
                const startId = (setNum - 1) * 100 + 1;
                const endId = setNum * 100;
                activeCards = allCards.filter(c => c.id >= startId && c.id <= endId);
            }
            currentIndex = 0;
            updateCard();
        }

        // Klawiatura: Strzałki i Spacja
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                flipCard();
            } else if (e.code === 'ArrowRight') {
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                prevCard();
            }
        });

        // Start
        renderText();
    </script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esperanto — nauka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF2EC;--ink:#14261C;--mute:#55665B;--card:#FBFCF9;--line:#C5D2C6;--green:#0B6B3A;--soft:#D5E8DB;--on:#fff;--warn:#A4471F;--warnsoft:#F2DACE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A14;--ink:#E6EEE7;--mute:#9DB0A2;--card:#18271E;--line:#2C3E32;--green:#5CC48D;--soft:#1F3A2A;--on:#0C1A12;--warn:#E38A5F;--warnsoft:#3D2519}}
:root[data-theme="dark"]{--bg:#101A14;--ink:#E6EEE7;--mute:#9DB0A2;--card:#18271E;--line:#2C3E32;--green:#5CC48D;--soft:#1F3A2A;--on:#0C1A12;--warn:#E38A5F;--warnsoft:#3D2519}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:20px 16px 32px}
h1{font:600 26px/1.2 "Literata",Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card);margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:11px 8px;font:500 15px inherit;color:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--green);color:var(--on)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
select,button{font:inherit;color:inherit}
select{flex:1 1 200px;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:9px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.prog{margin:0 0 14px;font-size:14px;color:var(--mute)}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.fill{height:100%;background:var(--green);width:0;transition:width .3s}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 14px;font-size:14px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:600}
.scene{perspective:1200px}
.card{display:block;width:100%;height:280px;position:relative;border:0;padding:0;background:none;cursor:pointer;text-align:left;transform-style:preserve-3d;transition:transform .45s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-left:10px solid var(--green);border-radius:6px;padding:22px 24px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.back{transform:rotateY(180deg);border-left-color:var(--warn)}
.lang{font-size:14px;color:var(--mute);margin-bottom:12px}
.txt{font:400 clamp(22px,5.5vw,30px)/1.3 "Literata",Georgia,serif}
.txt p{margin:0 0 .5em}
.face.eo .txt{font-weight:600}
.hint{margin:10px 0 0;color:var(--mute);font-size:14px;text-align:center}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{flex:1;padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.acts .yes{background:var(--green);color:var(--on);border-color:var(--green)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.nav button,.link{background:none;border:0;color:var(--mute);cursor:pointer;padding:8px 4px;text-decoration:underline}
.done{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--green);border-radius:6px;padding:28px 24px}
.done h2{margin:0 0 6px;font:600 22px "Literata",Georgia,serif}
.done p{margin:0 0 12px;color:var(--mute)}
.done button,.again{padding:10px 16px;border-radius:6px;border:0;background:var(--green);color:var(--on);cursor:pointer;margin-top:6px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px}
.colh{font-size:14px;color:var(--mute);margin:0 0 -2px}
.tile{width:100%;min-height:64px;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:6px;cursor:pointer;font:400 16px/1.35 "Literata",Georgia,serif;transition:background .15s,border-color .15s}
.tile.eo{font-weight:600}
.tile.sel{border-color:var(--green);border-width:2px;padding:11px 13px;background:var(--soft)}
.tile.ok{background:var(--soft);border-color:var(--green);color:var(--mute);cursor:default;border-left:8px solid var(--green)}
.tile.bad{background:var(--warnsoft);border-color:var(--warn)}
.qcard{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--green);border-radius:6px;padding:22px 22px 18px}
.qlang{font-size:14px;color:var(--mute);margin-bottom:8px}
.qtxt{font:400 clamp(20px,5vw,26px)/1.35 "Literata",Georgia,serif;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font:inherit}
.opt.right{background:var(--soft);border-color:var(--green)}
.opt.wrong{background:var(--warnsoft);border-color:var(--warn)}
.opt:disabled{cursor:default}
[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.card,.fill,.tile{transition:none}}
</style>
</head>

const sc=$('cat');
sc.add(new Option('Wszystkie działy ('+DATA.items.length+')',-1));
DATA.cats.forEach((c,i)=>sc.add(new Option(c+' ('+DATA.items.filter(x=>x[0]===i).length+')',i)));
sc.onchange=()=>{cat=+sc.value;renderMode()};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function lines(t){return t.split(' / ').map(s=>'<p>'+esc(s)+'</p>').join('')}
function idsForCat(){return DATA.items.map((x,i)=>i).filter(i=>cat<0||DATA.items[i][0]===cat)}
function setTabs(){[['tabF','f'],['tabP','p'],['tabQ','q']].forEach(([id,m])=>$(id).setAttribute('aria-pressed',mode===m))}
$('tabF').onclick=()=>{mode='f';setTabs();renderMode()};
$('tabP').onclick=()=>{mode='p';setTabs();renderMode()};
$('tabQ').onclick=()=>{mode='q';setTabs();renderMode()};
function renderMode(){mode==='f'?renderFiszki():mode==='p'?renderPary():renderQuiz()}

/* ---------- Fiszki ---------- */
let fDir=0,fRepeat=0,fDeck=[],fPos=0,fFlip=false;
function fBuild(rand){
  fDeck=idsForCat().filter(i=>fRepeat===0||!known.has(i));
  if(rand)fDeck=shuffle(fDeck);
  fPos=0;fFlip=false;fRender();
}
function fProgress(){
  const ids=idsForCat(),k=ids.filter(i=>known.has(i)).length;
  return {k,total:ids.length};
}
function fRender(){
  const {k,total}=fProgress();
  const v=$('view');
  let html='<p class="prog">Umiesz '+k+' z '+total+'<span class="track"><span class="fill" style="width:'+(total?100*k/total:0)+'%"></span></span></p>';
  html+='<div class="bar">'+
    '<div class="seg" role="group" aria-label="Kierunek"><button id="d0" aria-pressed="'+(fDir===0)+'">PL → EO</button><button id="d1" aria-pressed="'+(fDir===1)+'">EO → PL</button></div>'+
    '<div class="seg" role="group" aria-label="Zakres"><button id="m0" aria-pressed="'+(fRepeat===0)+'">Wszystkie</button><button id="m1" aria-pressed="'+(fRepeat===1)+'">Do powtórki</button></div></div>';
  if(!fDeck.length||fPos>=fDeck.length){
    html+='<div class="done"><h2>'+(fDeck.length?'To już cała talia':'Brak fiszek do powtórki')+'</h2><p>'+(fDeck.length?'Przejrzano wszystkie fiszki w tym zestawie.':'Wszystkie fiszki z tego działu są już oznaczone jako znane.')+'</p><button id="again">Zacznij od początku</button></div>';
    v.innerHTML=html;
    $('d0').onclick=()=>{fDir=0;fFlip=false;fRender()};$('d1').onclick=()=>{fDir=1;fFlip=false;fRender()};
    $('m0').onclick=()=>{fRepeat=0;fBuild(false)};$('m1').onclick=()=>{fRepeat=1;fBuild(false)};
    $('again').onclick=()=>{fRepeat=0;fBuild(false)};
    return;
  }
  const it=DATA.items[fDeck[fPos]];
  const fr=fDir?['esperanto',it[2],'eo']:['po polsku',it[1],'pl'];
  const bk=fDir?['po polsku',it[1],'pl']:['esperanto',it[2],'eo'];
  const face=(a,c)=>'<div class="face '+(c?'back ':'')+a[2]+'"><div class="lang">'+a[0]+'</div><div class="txt">'+lines(a[1])+'</div></div>';
  html+='<div class="scene"><button class="card" id="crd" aria-label="Obróć fiszkę">'+face(fr,0)+face(bk,1)+'</button></div>'+
    '<div class="acts"><button id="no">Jeszcze nie</button><button class="yes" id="yes">Umiem</button></div>'+
    '<div class="nav"><button id="prev">Poprzednia</button><button id="shuf">Pomieszaj</button><button id="next">Następna</button></div>'+
    '<p class="hint">'+(fPos+1)+' z '+fDeck.length+' · spacja obraca, ← → zmienia, 1/2 = jeszcze nie / umiem</p>';
  v.innerHTML=html;
  const c=$('crd');
  c.onclick=()=>{fFlip=!fFlip;c.classList.toggle('flip',fFlip)};
  $('d0').onclick=()=>{fDir=0;fFlip=false;fRender()};$('d1').onclick=()=>{fDir=1;fFlip=false;fRender()};
  $('m0').onclick=()=>{fRepeat=0;fBuild(false)};$('m1').onclick=()=>{fRepeat=1;fBuild(false)};
  $('no').onclick=()=>fMark(false);$('yes').onclick=()=>fMark(true);
  $('prev').onclick=()=>fGo(-1);$('next').onclick=()=>fGo(1);$('shuf').onclick=()=>fBuild(true);
}
function fMark(ok){if(fPos>=fDeck.length)return;const id=fDeck[fPos];ok?known.add(id):known.delete(id);saveKnown();fGo(1)}
function fGo(n){if(!fDeck.length)return;fPos=Math.max(0,Math.min(fDeck.length,fPos+n));fFlip=false;fRender()}

/* ---------- Pary ---------- */
let pN=8,pIds=[],pMatched=new Set(),pSel=null,pMist=0,pT0=0,pTimer=null,pLock=false,pOver=false;
function pBestKey(){return 'eo-pary-best-'+pN}
function pFmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function pBuild(){
  clearInterval(pTimer);pTimer=null;
  const seenPl=new Set(),seenEo=new Set(),pool=[];
  shuffle(idsForCat()).forEach(i=>{const x=DATA.items[i];if(seenPl.has(x[1])||seenEo.has(x[2]))return;seenPl.add(x[1]);seenEo.add(x[2]);pool.push(i)});
  pIds=pool.slice(0,pN);pMatched=new Set();pSel=null;pMist=0;pT0=0;pLock=false;pOver=false;
  pRender();
}
function pRender(){
  let b=null;try{b=localStorage.getItem(pBestKey())}catch(e){}
  const v=$('view');
  let html='<div class="bar"><div class="seg" role="group" aria-label="Liczba par">'+
    [5,8,10].map(x=>'<button data-n="'+x+'" aria-pressed="'+(pN===x)+'">'+x+' par</button>').join('')+
    '</div><button class="again" id="pnew">Nowa runda</button></div>';
  html+='<p class="stats"><span>Pary: <b>'+pMatched.size+'/'+pIds.length+'</b></span><span>Pomyłki: <b id="pm">'+pMist+'</b></span><span>Czas: <b id="pt">0:00</b></span>'+(b?'<span>Rekord ('+pN+' par): <b>'+pFmt(+b)+'</b></span>':'')+'</p>';
  if(!pIds.length){
    html+='<div class="done"><h2>Za mało zwrotów w tym dziale</h2><p>Wybierz inny dział albo mniejszą liczbę par.</p></div>';
    v.innerHTML=html;bindPBar();return;
  }
  html+='<div class="board"><div class="col"><p class="colh">Po polsku</p><div class="col" id="pL"></div></div><div class="col"><p class="colh">Esperanto</p><div class="col" id="pR"></div></div></div><div id="pdone"></div>';
  v.innerHTML=html;
  const mk=(side,list)=>list.map(i=>'<button class="tile '+(side==='R'?'eo':'pl')+'" data-side="'+side+'" data-id="'+i+'">'+esc(DATA.items[i][side==='L'?1:2])+'</button>').join('');
  $('pL').innerHTML=mk('L',shuffle(pIds));
  $('pR').innerHTML=mk('R',shuffle(pIds));
  document.querySelectorAll('.board .tile').forEach(t=>t.onclick=()=>pPick(t));
  bindPBar();
}
function bindPBar(){
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{pN=+b.dataset.n;pBuild()});
  $('pnew').onclick=pBuild;
}
function pTick(){const t=$('pt');if(t)t.textContent=pFmt(Math.floor((Date.now()-pT0)/1000))}
function pTile(side,id){return document.querySelector('.tile[data-side="'+side+'"][data-id="'+id+'"]')}
function pPick(b){
  if(pLock||pOver||b.classList.contains('ok'))return;
  const side=b.dataset.side,id=+b.dataset.id;
  if(!pT0){pT0=Date.now();pTimer=setInterval(pTick,250)}
  if(pSel&&pSel.side===side){const same=pSel.id===id;pTile(pSel.side,pSel.id).classList.remove('sel');pSel=null;if(same)return}
  if(!pSel){pSel={side,id};b.classList.add('sel');return}
  const other=pTile(pSel.side,pSel.id);
  if(pSel.id===id){
    pMatched.add(id);[b,other].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});pSel=null;
    const st=document.querySelector('.stats b');if(st)st.textContent=pMatched.size+'/'+pIds.length;
    if(pMatched.size===pIds.length)pFinish();
  }else{
    pMist++;const mm=$('pm');if(mm)mm.textContent=pMist;pLock=true;
    b.classList.add('bad');other.classList.add('bad');
    setTimeout(()=>{b.classList.remove('bad');other.classList.remove('bad');other.classList.remove('sel');pSel=null;pLock=false},600);
  }
}
function pFinish(){
  pOver=true;clearInterval(pTimer);
  const s=Math.floor((Date.now()-pT0)/1000);
  let rec='';
  try{const b=localStorage.getItem(pBestKey());if(!b||s<+b){localStorage.setItem(pBestKey(),s);rec=' To nowy rekord dla '+pIds.length+' par.'}}catch(e){}
  $('pdone').innerHTML='<div class="done"><h2>Runda ukończona</h2><p>Czas: '+pFmt(s)+', pomyłki: '+pMist+'.'+rec+'</p><button id="pagain">Zagraj jeszcze raz</button></div>';
  $('pagain').onclick=pBuild;
}

/* ---------- Quiz ---------- */
let qScore=0,qAsked=0,qCur=null,qDeck=[],qAnswered=false;
function qBuild(){
  qDeck=shuffle(idsForCat());qScore=0;qAsked=0;qNext();
}
function qNext(){
  qAnswered=false;
  if(!qDeck.length||qDeck.length<4){qDone(true);return}
  if(qAsked>=Math.min(10,qDeck.length)){qDone(false);return}
  const id=qDeck[qAsked];
  const pool=idsForCat().filter(i=>i!==id);
  const wrong=shuffle(pool).slice(0,3);
  const opts=shuffle([id,...wrong]);
  qCur={id,opts};
  qRender();
}
function qRender(){
  const v=$('view');
  const it=DATA.items[qCur.id];
  let html='<p class="prog">Pytanie '+(qAsked+1)+' z '+Math.min(10,qDeck.length)+' · wynik: '+qScore+'</p>';
  html+='<div class="qcard"><div class="qlang">Jak powiedzieć po esperancku:</div><div class="qtxt">'+esc(it[1].split(' / ')[0])+'</div>';
  qCur.opts.forEach(id=>{html+='<button class="opt" data-id="'+id+'">'+esc(DATA.items[id][2].split(' / ')[0])+'</button>'});
  html+='</div>';
  v.innerHTML=html;
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>qAnswer(b));
}
function qAnswer(b){
  if(qAnswered)return;qAnswered=true;
  const id=+b.dataset.id,ok=id===qCur.id;
  if(ok)qScore++;
  document.querySelectorAll('.opt').forEach(o=>{
    o.disabled=true;
    if(+o.dataset.id===qCur.id)o.classList.add('right');
    else if(o===b)o.classList.add('wrong');
  });
  qAsked++;
  setTimeout(qNext,900);
}
function qDone(tooFew){
  const v=$('view');
  v.innerHTML='<div class="done"><h2>'+(tooFew?'Za mało zwrotów w tym dziale':'Quiz ukończony')+'</h2>'+
    (tooFew?'<p>Wybierz inny dział — quiz potrzebuje co najmniej 4 zwrotów.</p>':'<p>Wynik: '+qScore+' z '+qAsked+'.</p>')+
    '<button id="qagain">Zagraj jeszcze raz</button></div>';
  $('qagain').onclick=qBuild;
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||mode!=='f')return;
  if(e.key===' '){e.preventDefault();const c=$('crd');if(c){fFlip=!fFlip;c.classList.toggle('flip',fFlip)}}
  else if(e.key==='ArrowRight')fGo(1);
  else if(e.key==='ArrowLeft')fGo(-1);
  else if(e.key==='1')fMark(false);
  else if(e.key==='2')fMark(true);
});

function renderModeEntry(){
  if(mode==='f')fBuild(false);
  else if(mode==='p')pBuild();
  else qBuild();
}
renderModeEntry();
const _origRenderMode=renderMode;
renderMode=renderModeEntry;
</script>
</body>
</html>

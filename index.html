<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiszki Esperanto - Ciemny Motyw</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-hover: #2c2c2c;
            --primary: #4caf50;
            --primary-dark: #388e3c;
            --error: #f44336;
            --error-dark: #d32f2f;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
        }

        .select-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        select, button.reset-btn {
            padding: 10px 14px;
            font-size: 0.95rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text-main);
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--primary);
        }

        button.reset-btn {
            background-color: #333;
            border-color: #444;
        }

        button.reset-btn:hover {
            background-color: #444;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 550px;
            height: 280px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-radius: 16px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
            border-radius: 16px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #1a261a;
            border-color: var(--primary-dark);
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .content {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 20px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 550px;
            justify-content: center;
        }

        .action-btn {
            flex: 1;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .btn-know {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-dont-know {
            background-color: var(--error);
            color: #ffffff;
        }

        .btn-know:hover { background-color: var(--primary-dark); }
        .btn-dont-know:hover { background-color: var(--error-dark); }

        .counter {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stats {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-know { color: var(--primary); font-weight: bold; }
        .badge-repeat { color: var(--error); font-weight: bold; }
    </style>
</head>
<body>

    <h1>Fiszki Esperanto</h1>

    <div class="select-container">
        <label for="set-select">Tryb nauki: </label>
        <select id="set-select" onchange="changeSet()">
            <option value="all">Wszystkie zdania (1-1000)</option>
            <option value="repeat">Tylko do powtórki ("Nie znam")</option>
            <option value="1">Zestaw 1 (1-100)</option>
            <option value="2">Zestaw 2 (101-200)</option>
            <option value="3">Zestaw 3 (201-300)</option>
            <option value="4">Zestaw 4 (301-400)</option>
            <option value="5">Zestaw 5 (401-500)</option>
            <option value="6">Zestaw 6 (501-600)</option>
            <option value="7">Zestaw 7 (601-700)</option>
            <option value="8">Zestaw 8 (701-800)</option>
            <option value="9">Zestaw 9 (801-900)</option>
            <option value="10">Zestaw 10 (901-1000)</option>
        </select>
        <button class="reset-btn" onclick="resetProgress()">Resetuj postęp</button>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <div class="label">Język polski</div>
                <div class="content" id="front-text">Ładowanie...</div>
                <div class="hint">Kliknij lub naciśnij Spację, aby zobaczyć tłumaczenie</div>
            </div>
            <div class="card-face card-back">
                <div class="label">Esperanto</div>
                <div class="content" id="back-text">Ładowanie...</div>
                <div class="hint">Oceń swoją znajomość poniżej</div>
            </div>
        </div>
    </div>

    <div class="counter" id="counter">Fiszka 1 z 1000</div>

    <div class="controls">
        <button class="action-btn btn-dont-know" onclick="markCard(false)">Nie znam (←)</button>
        <button class="action-btn btn-know" onclick="markCard(true)">Znam (→)</button>
    </div>

    <div class="stats">
        <div class="stat-item">Opanowane: <span class="badge-know" id="stat-known">0</span></div>
        <div class="stat-item">Do powtórki: <span class="badge-repeat" id="stat-repeat">0</span></div>
    </div>

    <script>
        const allCards = [
            // ZESTAW 1 (1-100)
            { id: 1, pl: "Cześć! Jak się masz?", eo: "Saluton! Kiel vi fartas?" },
            { id: 2, pl: "Mam się dobrze, dziękuję.", eo: "Mi fartas bone, dankon." },
            { id: 3, pl: "Jak masz na imię?", eo: "Kio estas via nomo?" },
            { id: 4, pl: "Nazywam się Piotr.", eo: "Mia nomo estas Petro." },
            { id: 5, pl: "Miło cię poznać.", eo: "Plaĉas konatiĝi kun vi." },
            { id: 6, pl: "Skąd pochodzisz?", eo: "De kie vi venas?" },
            { id: 7, pl: "Pochodzę z Polski.", eo: "Mi venas el Pollando." },
            { id: 8, pl: "Gdzie mieszkasz?", eo: "Kie vi loĝas?" },
            { id: 9, pl: "Mieszkam w Warszawie.", eo: "Mi loĝas en Varsovio." },
            { id: 10, pl: "Ile masz lat?", eo: "Kiom da jaroj vi havas?" },
            { id: 11, pl: "Mam trzydzieści lat.", eo: "Mi havas tridek jarojn." },
            { id: 12, pl: "Czy mówisz po esperancku?", eo: "Ĉu vi parolas Esperanton?" },
            { id: 13, pl: "Mówię trochę po esperancku.", eo: "Mi parolas modere Esperanton." },
            { id: 14, pl: "Uczę się tego języka.", eo: "Mi lernas ĉi tiun lingvon." },
            { id: 15, pl: "Esperanto jest łatwe.", eo: "Esperanto estas facila." },
            { id: 16, pl: "Co to jest?", eo: "Kio estas tio?" },
            { id: 17, pl: "To jest książka.", eo: "Tio estas libro." },
            { id: 18, pl: "To jest mój dom.", eo: "Tio estas mia domo." },
            { id: 19, pl: "Gdzie jest łazienka?", eo: "Kie estas la banĉambro?" },
            { id: 20, pl: "Przepraszam, nie rozumiem.", eo: "Pardonon, mi ne komprenas." },
            { id: 21, pl: "Czy możesz powtórzyć?", eo: "Ĉu vi povas ripeti?" },
            { id: 22, pl: "Proszę mówić wolniej.", eo: "Bonvolu paroli pli malrapide." },
            { id: 23, pl: "Co to znaczy?", eo: "Kion tio signifas?" },
            { id: 24, pl: "Dziękuję bardzo.", eo: "Multe dankas." },
            { id: 25, pl: "Nie ma za co.", eo: "Ne dankinde." },
            { id: 26, pl: "Proszę (przy dawaniu).", eo: "Jen, bonvolu." },
            { id: 27, pl: "Tak, zgadzam się.", eo: "Jes, mi konsentas." },
            { id: 28, pl: "Nie, to nie jest prawda.", eo: "Ne, tio ne estas vera." },
            { id: 29, pl: "Może później.", eo: "Eble poste." },
            { id: 30, pl: "Do widzenia!", eo: "Ĝis la revido!" },
            { id: 31, pl: "Do zobaczenia jutro!", eo: "Ĝis la revido morgaŭ!" },
            { id: 32, pl: "Dobry wieczór.", eo: "Bonan vesperon." },
            { id: 33, pl: "Dobranoc.", eo: "Bonan nokton." },
            { id: 34, pl: "Miłego dnia!", eo: "Bonan tagon!" },
            { id: 35, pl: "Smacznego!", eo: "Bonan apetiton!" },
            { id: 36, pl: "Na zdrowie!", eo: "Je via sano!" },
            { id: 37, pl: "Pomocy!", eo: "Helpon!" },
            { id: 38, pl: "Która jest godzina?", eo: "Kioma horo estas?" },
            { id: 39, pl: "Jest godzina piąta.", eo: "Estas la kvina horo." },
            { id: 40, pl: "Dzisiaj jest piękny dzień.", eo: "Hodiaŭ estas bela tago." },
            { id: 41, pl: "Słońce świeci.", eo: "La suno brilas." },
            { id: 42, pl: "Pada deszcz.", eo: "Pluvas." },
            { id: 43, pl: "Jest zimno.", eo: "Estas malvarme." },
            { id: 44, pl: "Jest gorąco.", eo: "Estas varmege." },
            { id: 45, pl: "Lubię kawę.", eo: "Mi ŝatas kafon." },
            { id: 46, pl: "Chcę pić wodę.", eo: "Mi volas trinki akvon." },
            { id: 47, pl: "Czy masz czas?", eo: "Ĉu vi havas tempon?" },
            { id: 48, pl: "Jestem zajęty.", eo: "Mi estas okupa." },
            { id: 49, pl: "Idę do pracy.", eo: "Mi iras al la laboro." },
            { id: 50, pl: "Ona czyta gazetę.", eo: "Ŝi legas ĵurnalon." },

            // ZESTAW 2 (101-200)
            { id: 101, pl: "Dzień dobry, w czym mogę pomóc?", eo: "Bonan tagon, kiel mi povas helpi?" },
            { id: 102, pl: "Chciałbym zarezerwować pokój.", eo: "Mi ŝatus rezervi ĉambron." },
            { id: 103, pl: "Czy są wolne miejsca?", eo: "Ĉu estas liberaj lokoj?" },

            // ZESTAW 9 (801-900)
            { id: 801, pl: "Moim zdaniem to podejście jest bardzo skuteczne.", eo: "Miaopinie tiu aliro estas tre efika." },
            { id: 802, pl: "Czy zgadzasz się z tą propozycją?", eo: "Ĉu vi konsentas kun tiu propono?" },

            // ZESTAW 10 (901-1000)
            { id: 901, pl: "Ludwik Zamenhof stworzył język Esperanto.", eo: "Ludoviko Zamenhof kreis la lingvon Esperanto." },
            { id: 1000, pl: "Powodzenia we wszystkim i do zobaczenia!", eo: "Sukceson en ĉio kaj ĝis la revido!" }
        ];

        // Stan aplikacji i wczytywanie z localStorage
        let userProgress = JSON.parse(localStorage.getItem('eo_flashcards_progress')) || {
            known: [],
            repeat: []
        };

        let activeCards = [];
        let currentIndex = 0;
        let isFlipped = false;

        function saveProgress() {
            localStorage.setItem('eo_flashcards_progress', JSON.stringify(userProgress));
            updateStatsView();
        }

        function updateStatsView() {
            document.getElementById('stat-known').innerText = userProgress.known.length;
            document.getElementById('stat-repeat').innerText = userProgress.repeat.length;
        }

        function filterCards() {
            const val = document.getElementById('set-select').value;
            if (val === 'all') {
                activeCards = [...allCards];
            } else if (val === 'repeat') {
                activeCards = allCards.filter(c => userProgress.repeat.includes(c.id));
            } else {
                const setNum = parseInt(val);
                const startId = (setNum - 1) * 100 + 1;
                const endId = setNum * 100;
                activeCards = allCards.filter(c => c.id >= startId && c.id <= endId);
            }
        }

        function renderText() {
            if (activeCards.length === 0) {
                document.getElementById('front-text').innerText = "Brak fiszek w tej kategorii!";
                document.getElementById('back-text').innerText = "Brak fiszek w tej kategorii!";
                document.getElementById('counter').innerText = "0 z 0";
                return;
            }
            document.getElementById('front-text').innerText = activeCards[currentIndex].pl;
            document.getElementById('back-text').innerText = activeCards[currentIndex].eo;
            document.getElementById('counter').innerText = `Zdanie ${activeCards[currentIndex].id} (Fiszka ${currentIndex + 1} z ${activeCards.length})`;
        }

        function flipCard() {
            if (activeCards.length === 0) return;
            const cardElement = document.getElementById('flashcard');
            cardElement.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function updateCard() {
            const cardElement = document.getElementById('flashcard');
            if (isFlipped) {
                cardElement.classList.remove('flipped');
                isFlipped = false;
                setTimeout(renderText, 250);
            } else {
                renderText();
            }
        }

        function markCard(knows) {
            if (activeCards.length === 0) return;

            const currentId = activeCards[currentIndex].id;

            if (knows) {
                if (!userProgress.known.includes(currentId)) {
                    userProgress.known.push(currentId);
                }
                userProgress.repeat = userProgress.repeat.filter(id => id !== currentId);
            } else {
                if (!userProgress.repeat.includes(currentId)) {
                    userProgress.repeat.push(currentId);
                }
                userProgress.known = userProgress.known.filter(id => id !== currentId);
            }

            saveProgress();

            const currentMode = document.getElementById('set-select').value;
            if (currentMode === 'repeat') {
                filterCards();
                if (currentIndex >= activeCards.length) {
                    currentIndex = 0;
                }
            } else {
                currentIndex = (currentIndex + 1) % activeCards.length;
            }

            updateCard();
        }

        function changeSet() {
            filterCards();
            currentIndex = 0;
            updateCard();
        }

        function resetProgress() {
            if (confirm("Czy na pewno chcesz zresetować cały swój postęp?")) {
                userProgress = { known: [], repeat: [] };
                saveProgress();
                changeSet();
            }
        }

        // Obsługa klawiatury
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                flipCard();
            } else if (e.code === 'ArrowRight') {
                markCard(true);
            } else if (e.code === 'ArrowLeft') {
                markCard(false);
            }
        });

        // Inicjalizacja
        updateStatsView();
        filterCards();
        renderText();
    </script>
</body>
</html>
